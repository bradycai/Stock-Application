name: CI

on:
  pull_request:
  push:
    branches: [Production]

# Least privilege: CI only reads the repository. No secrets are used anywhere in this
# workflow — Claude and Alpaca are mocked in the test suite, and no step can place an order.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trading_assistant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Isolated, throwaway test database. Never point CI at a real account or database.
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/trading_assistant_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/trading_assistant_test
      TRADING_MODE: paper
      AUTO_TRADING_ENABLED: "false"
      CONTINUOUS_MONITOR_ENABLED: "false"
      ANTHROPIC_API_KEY: ""
      ALPACA_KEY: ""
      ALPACA_SECRET: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check app tests migrations
      - name: Tests (pytest)
        run: pytest -q

  frontend:
    name: Frontend (install + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install from lockfile
        run: npm ci
      - name: Build
        run: npm run build
